name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24' # current Node.js LTS

jobs:
  ci:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (api + web)
        run: pnpm test

      - name: Build (api + web)
        run: pnpm build

  e2e-api:
    name: API e2e (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter api

      - name: Run migrations
        run: pnpm --filter api migration:run

      - name: E2E tests
        run: pnpm --filter api test:e2e

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/v1/health
          echo
          curl -fsS http://localhost:4200/api/v1/health   # through the nginx /api proxy
          echo
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
          curl -fsS http://localhost:3000/api/docs-json > /dev/null
          # Auth round-trip through the nginx proxy (same origin as the SPA).
          TOKEN=$(curl -fsS -X POST http://localhost:4200/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Smoke-passw0rd","fullName":"Smoke Test"}' \
            | jq -er .accessToken)
          curl -fsS http://localhost:4200/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          echo
          # Registration opened a COP wallet; top it up (idempotently) and check the balance.
          WALLET_ID=$(curl -fsS http://localhost:4200/api/v1/accounts \
            -H "Authorization: Bearer $TOKEN" | jq -er '.[0].id')
          curl -fsS -X POST http://localhost:4200/api/v1/deposits \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: smoke-deposit-0001' \
            -d "{\"accountId\":\"$WALLET_ID\",\"amountMinor\":5000000}" \
            | jq -e '.balanceAfterMinor == 5000000'
          # P2P transfer to a second user, then a retry with the same key is replayed.
          BOB_TOKEN=$(curl -fsS -X POST http://localhost:4200/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"bob@example.com","password":"Smoke-passw0rd","fullName":"Bob Smoke"}' \
            | jq -er .accessToken)
          BOB_NUMBER=$(curl -fsS http://localhost:4200/api/v1/accounts \
            -H "Authorization: Bearer $BOB_TOKEN" | jq -er '.[0].number')
          TRANSFER="{\"fromAccountId\":\"$WALLET_ID\",\"toAccountNumber\":\"$BOB_NUMBER\",\"amountMinor\":1500000}"
          for attempt in 1 2; do
            curl -fsS -D /tmp/headers.txt -X POST http://localhost:4200/api/v1/transfers \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -H 'Idempotency-Key: smoke-transfer-0001' -d "$TRANSFER" \
              | jq -e '.status == "COMPLETED" and .balanceAfterMinor == 3500000'
          done
          grep -qi '^idempotent-replayed: true' /tmp/headers.txt
          curl -fsS "http://localhost:4200/api/v1/accounts/$WALLET_ID" \
            -H "Authorization: Bearer $TOKEN" | jq -e '.balanceMinor == 3500000'
          curl -fsS "http://localhost:4200/api/v1/accounts/$WALLET_ID/transactions?limit=1" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -e '.items[0].direction == "OUT" and .items[0].amountMinor == 1500000 and .nextCursor != null'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
